name: 🔒 CodeQL

# Darmowe skanowanie bezpieczeństwa od GitHuba (Python i JavaScript). Wyniki: zakładka Security → Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  analiza:
    name: CodeQL ${{ matrix.jezyk }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        jezyk: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.jezyk }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.jezyk }}
